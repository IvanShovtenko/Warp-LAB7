name: Build .NET project       # klucz i wartość
env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: ./Warp_proj/Warp_proj.csproj

on:                            # obiekt zagnieżdżony
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:                     # lista
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show directory
        run: echo "Runner is ready"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        shell: bash
        run: dotnet restore "$PROJECT_PATH"
      - name: Build project
        shell: bash
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore
      - name: Run project
        shell: bash
        run: dotnet run --project "$PROJECT_PATH" --configuration Release --no-build